[project]
name = "ssh-sysadmin-toolkit"
version = "1.0.0"
description = "Small, safe CLI for administering a Linux host over SSH"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["paramiko>=3.4,<5", "requests>=2.31,<3"]

[project.scripts]
sshadmin = "sshadmin.cli:main"

[tool.setuptools]
packages = ["sshadmin"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP"]
ignore = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
